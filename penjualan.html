<!DOCTYPE html>
<html lang="id" class="h-full bg-stone-50">

  <title>Dashboard Rekap Penjualan - Corat Coret Layar</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

      theme: {
        extend: {
          colors: {
            red: {
              50: '#FFF4ED',
              100: '#FFE6D5',

              500: '#FF6B2E',
              600: '#FF5A1F',
              700: '#C93F0F',

        },
      },

  <!-- Google Fonts: Inter & JetBrains Mono -->
